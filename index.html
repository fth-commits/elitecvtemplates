<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite CV Templates - 20 Professional Designs!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cta-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 0 3rem;
            color: white;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .hero p {
            font-size: 1.25rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
        }

        /* Templates Grid */
        .templates-section {
            padding: 2rem 0 4rem;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .template-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .template-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .template-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            object-position: top;
            background: #f1f5f9;
            display: block;
        }

        .template-info {
            padding: 1.5rem;
        }

        .template-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .template-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .template-desc {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .features {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .feature-tag {
            background: #f1f5f9;
            color: var(--gray);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .buy-link {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .buy-link:hover {
            opacity: 0.9;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            background: none;
            border: none;
            font-family: Arial, sans-serif;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 2rem;
            cursor: pointer;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .lightbox-nav:hover {
            background: rgba(255,255,255,0.4);
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        /* Footer */
        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
        }

        .guarantee {
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 15px;
            margin: 2rem 0;
            text-align: center;
            color: white;
        }

        .guarantee h3 {
            margin-bottom: 0.5rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }
            
            .hero h1 {
                font-size: 2rem;
            }

            .template-image {
                height: 300px;
            }

            .lightbox-nav {
                display: none;
            }
        }

        /* Loading animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .template-card {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .template-card:nth-child(1) { animation-delay: 0.1s; }
        .template-card:nth-child(2) { animation-delay: 0.2s; }
        .template-card:nth-child(3) { animation-delay: 0.3s; }
        .template-card:nth-child(4) { animation-delay: 0.4s; }
        .template-card:nth-child(5) { animation-delay: 0.5s; }
        .template-card:nth-child(6) { animation-delay: 0.6s; }
        .template-card:nth-child(7) { animation-delay: 0.7s; }
        .template-card:nth-child(8) { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">Elite CV Templates</div>
            <a href="https://elitecvtemplates.gumroad.com/l/zvjdas" class="cta-button" target="_blank">Get All 20 Templates</a>
        </nav>
    </header>

    <section class="hero">
        <div class="container">
            <span class="badge">8 Professional Designs</span>
            <h1>Land Your Dream Job</h1>
            <p>Stand out with our collection of 20 meticulously designed CV templates.</p>
            <a href="https://elitecvtemplates.gumroad.com/l/zvjdas" class="cta-button" target="_blank" style="font-size: 1.25rem; padding: 1rem 2rem;">Get Instant Access</a>
        </div>
    </section>

    <section class="templates-section">
        <div class="container">
            <div class="templates-grid" id="templatesGrid">
                <!-- Templates will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <section class="container">
        <div class="guarantee">
            <h3>Stand out among others</h3>
            <p>.</p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Elite CV Templates. All rights reserved.</p>
            <p style="margin-top: 0.5rem; opacity: 0.8;">Secure payment via Gumroad</p>
        </div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">&#8249;</button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="CV Template">
        <button class="lightbox-nav lightbox-next" onclick="changeImage(1)">&#8250;</button>
    </div>

    <script>
        const templates = [
            { 
                file: "CV1.png", 
                name: "Modern Professional", 
                desc: "Clean layout with subtle colors, perfect for any industry",
                tags: ["ATS-Friendly", "Minimal", "Universal"]
            },
            { 
                file: "CV2.jpg", 
                name: "Creative Bold", 
                desc: "Stand out with vibrant accents and modern design",
                tags: ["Creative", "Bold", "Designers"]
            },
            { 
                file: "CV3.png", 
                name: "Executive Classic", 
                desc: "Traditional elegance for senior and management roles",
                tags: ["Professional", "Classic", "Executive"]
            },
            { 
                file: "CV4.png", 
                name: "Tech Minimalist", 
                desc: "Perfect for IT, engineering, and technical positions",
                tags: ["Tech", "Clean", "Engineering"]
            },
            { 
                file: "CV5.jpg", 
                name: "Corporate Blue", 
                desc: "Trustworthy and professional for corporate environments",
                tags: ["Business", "Corporate", "Finance"]
            },
            { 
                file: "CV6.png", 
                name: "Startup Dynamic", 
                desc: "Energetic design for innovators and entrepreneurs",
                tags: ["Modern", "Dynamic", "Startup"]
            },
            { 
                file: "CV7.jpg", 
                name: "Academic Scholar", 
                desc: "Comprehensive layout for researchers and academics",
                tags: ["Academic", "Detailed", "Education"]
            },
            { 
                file: "CV8.jpg", 
                name: "Designer Portfolio", 
                desc: "Showcase your creative work with visual emphasis",
                tags: ["Portfolio", "Visual", "Creative"]
            }
        ];

        let currentImageIndex = 0;
        const grid = document.getElementById('templatesGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        // Generate template cards
        templates.forEach((template, index) => {
            const card = document.createElement('div');
            card.className = 'template-card';
            card.innerHTML = `
                <img src="${template.file}" alt="${template.name}" class="template-image" onclick="openLightbox(${index})" style="cursor: pointer;">
                <div class="template-info">
                    <span class="template-number">${index + 1}</span>
                    <h3 class="template-name">${template.name}</h3>
                    <p class="template-desc">${template.desc}</p>
                    <div class="features">
                        ${template.tags.map(tag => `<span class="feature-tag">${tag}</span>`).join('')}
                    </div>
                    <a href="https://elitecvtemplates.gumroad.com/l/zvjdas" class="buy-link" target="_blank">Get This Template</a>
                </div>
            `;
            grid.appendChild(card);
        });

        // Lightbox functions
        function openLightbox(index) {
            currentImageIndex = index;
            lightboxImg.src = templates[index].file;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = templates.length - 1;
            if (currentImageIndex >= templates.length) currentImageIndex = 0;
            lightboxImg.src = templates[currentImageIndex].file;
        }

        // Close lightbox with escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
        });

        // Close lightbox when clicking outside image
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Check if images exist and handle errors
        document.querySelectorAll('.template-image').forEach(img => {
            img.onerror = function() {
                this.style.display = 'none';
                this.parentElement.innerHTML += `
                    <div style="height: 400px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #94a3b8; flex-direction: column;">
                        <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                        </svg>
                        <p style="margin-top: 1rem;">Image not found</p>
                        <p style="font-size: 0.875rem;">${img.src}</p>
                    </div>
                `;
            };
        });
    </script>
</body>
</html>
